<svg xmlns="http://www.w3.org/2000/svg" width="700" height="72" viewBox="0 0 700 72" role="img" aria-label="Data Science, Data Analytics, Machine Learning and NLP">
  <rect width="700" height="72" rx="16" fill="#0f172a"/>
  <text x="350" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#38BDF8">
    <tspan>Data Science</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.32;0.38;0.62;0.68" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="350" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#38BDF8" opacity="0">
    <tspan>Data Analytics</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.38;0.62;0.68" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="350" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#38BDF8" opacity="0">
    <tspan>Machine Learning</tspan>
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.32;0.38;0.62;0.68;0.95;1" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
